# Release bundles for Linux (AppImage + deb) and Windows (NSIS installer).
# Windows builds come only from here: cross-building Tauri from Linux is not
# reliable. Ubuntu 22.04 keeps the AppImage/deb glibc baseline old enough
# for most distros.

name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Check and test
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          (cd ui && bun run build && bun run test:node js/tests/volna-url.test.js js/tests/volna-media.test.js js/tests/lyrics-proxy.test.js js/tests/network-settings-model.test.js)

      - name: Fetch sidecars (xray, yt-dlp)
        run: scripts/fetch-sidecars.sh

      - name: Build bundles
        run: scripts/build.sh --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: volna-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
