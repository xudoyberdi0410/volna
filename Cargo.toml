[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/ytm",
    "crates/net",
    "crates/streams",
    "crates/wave",
    "crates/player",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
volna-ytm = { path = "crates/ytm" }
volna-net = { path = "crates/net" }
volna-streams = { path = "crates/streams" }
volna-wave = { path = "crates/wave" }
volna-player = { path = "crates/player" }
volna-daemon = { path = "crates/daemon" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "stream", "gzip", "brotli"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
http = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"

# Hot paths stay at full speed: DSP and analysis in the player, JSON parsing.
[profile.release.package.volna-player]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3
