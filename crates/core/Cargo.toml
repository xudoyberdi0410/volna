[package]
name = "volna-core"
description = "Everything the Volna UI calls, minus desktop hosting: one JSON command surface for the daemon and the mobile apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "volna_core"
# rlib for the daemon; staticlib (iOS) and cdylib (Android) with `ffi`.
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["ytdlp"]
# Desktop: stream resolution, cookies and the Yandex browser session through
# yt-dlp. Mobile builds use `--no-default-features` and inject a backend.
# (Forwards to `volna-streams/ytdlp` once that crate gates yt-dlp.)
ytdlp = []
# The C ABI in `ffi.rs` (`include/volna_core.h`).
ffi = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
dirs = "7"
# `color_palette`: decode covers (the formats `ImageCache` accepts).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Unicode folding for the Yandex → YouTube Music matcher (already pulled in by url).
icu_normalizer = { version = "2.1", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.1", default-features = false, features = ["compiled_data"] }
fastrand = "2.5"
rusqlite = { version = "0.40", features = ["bundled"] }
volna-ytm = { workspace = true }
volna-net = { workspace = true }
volna-streams = { workspace = true }
volna-wave = { workspace = true }
volna-player = { workspace = true, default-features = false }
volna-scrobble = { workspace = true }
volna-lyrics = { workspace = true }

[dev-dependencies]
tempfile = "3"
