# cbindgen --config cbindgen.toml --crate volna-core --output include/volna_core.h
# (run in crates/core; see docs/mobile-build.md)
language = "C"
include_guard = "VOLNA_CORE_H"
autogen_warning = "/* Generated by cbindgen from crates/core/src/ffi.rs. Do not edit. */"
documentation = true
documentation_style = "c99"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
cpp_compat = true
usize_is_size_t = true

[parse]
parse_deps = false


[export]
include = ["VolnaCore"]
# Only the ABI: no constants from the rest of the crate.
item_types = ["functions", "typedefs", "opaque"]

