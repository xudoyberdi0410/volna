[package]
name = "volna-daemon"
description = "Volna without a GUI toolkit: hosts volna-core with GStreamer, the tray, MPRIS, the IPC socket and the volna:// handler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "volna_daemon"

[[bin]]
name = "volna"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
dirs = "7"
mimalloc = "0.1.52"
volna-streams = { workspace = true, features = ["ytdlp"] }
volna-player = { workspace = true, features = ["gstreamer"] }
volna-core = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Tray (StatusNotifierItem: left click shows the window) and MPRIS.
ksni = "0.3"
mpris-server = { version = "0.10", features = ["tokio"] }
png = "0.17"

