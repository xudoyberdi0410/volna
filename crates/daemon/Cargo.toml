[package]
name = "volna-daemon"
description = "Volna without the webview: player, tray, MPRIS, network, wave and the volna:// handler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "volna_daemon"

[[bin]]
name = "volna"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
dirs = "7"
# `color_palette`: decode covers (the formats `ImageCache` accepts).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mimalloc = "0.1.52"
# Unicode folding for the Yandex → YouTube Music matcher (already pulled in by url).
icu_normalizer = { version = "2.1", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.1", default-features = false, features = ["compiled_data"] }
fastrand = "2.5"
rusqlite = { version = "0.40", features = ["bundled"] }
volna-ytm = { workspace = true }
volna-net = { workspace = true }
volna-streams = { workspace = true }
volna-wave = { workspace = true }
volna-player = { workspace = true }
volna-lyrics = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Tray (StatusNotifierItem: left click shows the window) and MPRIS.
ksni = "0.3"
mpris-server = { version = "0.10", features = ["tokio"] }
png = "0.17"

[dev-dependencies]
tempfile = "3"
