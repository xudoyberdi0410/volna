[package]
name = "volna-player"
description = "Native audio player of Volna: GStreamer decks, queue, DSP and visualizer analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gst = { package = "gstreamer", version = "0.25" }
gst-base = { package = "gstreamer-base", version = "0.25" }
gst-audio = { package = "gstreamer-audio", version = "0.25" }
glib = "0.22"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
realfft = "3.5"
arc-swap = "1.7"
fastrand = "2.5"

[dev-dependencies]
tempfile = "3"
