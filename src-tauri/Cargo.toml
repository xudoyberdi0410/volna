[package]
name = "volna"
description = "Desktop YouTube Music player with My Wave"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "volna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
volna-ytm = { workspace = true }
volna-net = { workspace = true }
volna-streams = { workspace = true }
volna-wave = { workspace = true }
volna-player = { workspace = true }
tauri-plugin-single-instance = "2"
mimalloc = "0.1.52"

# Same version and features as wry, so the webview types match (webview_memory.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# Tray (StatusNotifierItem: left click shows the window) and MPRIS.
ksni = "0.3"
mpris-server = { version = "0.10", features = ["tokio"] }

# Linux uses ksni; Tauri's tray-icon (libayatana-appindicator) only on Windows.
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[dev-dependencies]
tempfile = "3"
