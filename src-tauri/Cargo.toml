[package]
name = "volna"
description = "Desktop YouTube Music player with My Wave"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "volna-window"
path = "src/main.rs"

[lib]
name = "volna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
mimalloc = "0.1.52"
# Everything but the webview: state, the IPC protocol, the Yandex cookies.
volna-daemon = { workspace = true }
volna-streams = { workspace = true }

# Same version and features as wry, so the webview types match (webview_memory.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[dev-dependencies]
tempfile = "3"
